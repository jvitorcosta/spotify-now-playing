[project]
name = "spotify-now-playing"
version = "2.0.0"
description = "Spotify now-playing card for a GitHub profile README"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "Werkzeug>=3.0.0,<4.0.0",
    "Jinja2>=3.1.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "certifi>=2023.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "colorthief>=0.2.1,<1.0.0",
    "Pillow>=10.0.0,<11.0.0",
]

[tool.vercel]
# Vercel no longer finds the Flask app on its own; point it at api/orchestrator.py
entrypoint = "api.orchestrator:app"

[dependency-groups]
dev = ["pytest>=8.0"]
